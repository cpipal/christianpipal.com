# DRAFT bio — rewrite in your own voice.
bio: |
  I am a Senior Research and Teaching Associate at the [Department of Communication and Media Research (IKMZ)](https://www.ikmz.uzh.ch)
  at the University of Zurich. My research asks how political communication changes when platforms,
  influencers and AI reshape **who speaks to the public, and how**.

  Substantively, I study political social media influencers and other non-traditional political
  communicators, the emotional tone and style of political elites, and how AI enters political debate.
  Methodologically, I develop and validate computational tools for communication research — most recently
  large language models for content analysis — and I write about how our discipline produces evidence.

  I hold a PhD in Political Science from the University of Amsterdam (2024) and have been a visiting
  researcher at LMU Munich and the University of Vienna.

