    items:
      - id: citation-limits
        abstract: "Do policies exempting references from journal word limits increase the demographic diversity of cited authors? We test this using a natural experiment across 27 political science journals. Between 2022 and 2024, ten journals adopted policies exempting references from manuscript word counts, while seventeen maintained traditional limits. Using generalized synthetic control methods to construct counterfactuals robust to differential pre-trends, we find that removing reference limits significantly expands bibliographies (+10.3 citations per article), confirming that word limits restrict citation volume. However, the proportions of citations for women, racial/ethnic minorities, and scholars from the Global South remain unchanged. Rather than citing outside their original bubbles, authors expand their bibliographies proportionally, maintaining pre-existing demographic ratios. Minimum detectable effects of 1.2–2.8% allow us to rule out even modest compositional shifts. These findings, robust across classification methods, estimators, levels of analysis, and journal exclusions, support a scale-invariance interpretation. Additional reference capacity alone does not change the exposure and attention patterns from which authors select citations. In short, structural interventions increase citation volume, but changing citation composition may require changing the literature scholars encounter and prioritize."
        figure: figures/citation-limits.png
        figure_caption: "Generalized synthetic control estimates of the treatment effect by quarter relative to policy adoption; citation volume (Panel A) opens a clear positive gap after adoption while the shares of female, minority and Global South first authors (Panels B–D) stay indistinguishable from zero."
        title: "Do Citation Limits Constrain Diversity? Evidence from a Natural Experiment across Political Science Journals"
        authors: ["Wack, Morgan", "Pipal, Christian", "Vogel, Eva-Maria", "Erickson, Megan"]
        year: 2026
        venue: "PS: Political Science & Politics"
        details: forthcoming

      - id: multilingual-survey
        title: "Challenges for multilingual computational text analysis research: Evidence from a pre-registered survey of social science researchers"
        authors: ["Dolinsky, Alona O.", "Schoonvelde, Martijn", "Pipal, Christian", "Baden, Christian", "Lind, Fabienne", "Shababo, Guy", "van der Velden, Mariken A. C. G.", "Zalik, Avital"]
        year: 2026
        venue: Acta Politica
        details: online first
        preprint: https://doi.org/10.31219/osf.io/9mybf_v2
        abstract: >-
          This paper investigates how English-centric developments of computational text analysis methods (CTAM)
          shape the experiences and practices of social science researchers working with English, non-English, and
          multilingual texts. Drawing on a survey of 433 scholars who published text-based research in top social
          science journals between 2016 and 2020, we examine concerns about CTAM's validity and availability, use of
          validation strategies, and barriers to working with multilingual corpora. Our survey findings indicate that
          researchers working with text in multiple languages express greater concern about CTAM's validity, but do
          not report using more validation strategies. Furthermore, researchers whose native language is not English
          are more likely to rely on English-language texts when using CTAM than when not. These findings illustrate
          a structural bias in tool development and resource availability that pushes computational research toward
          English-language data. We conclude by outlining practical steps toward a more inclusive and linguistically
          diverse computational social science.

      - id: self-correction
        abstract: "While Large Language Models (LLMs) have transformed content analysis, their ability to self-correct to achieve higher agreement with human coders remains contested. Recent evidence suggests LLMs fail to self-correct on reasoning tasks, but it is unclear if this limitation applies to classification, where the goal is maximizing overlap with human ground truth. We investigate iterative self-refinement, a pipeline where a model generates an initial classification, critiques its own output, and generates a final refined prediction. We test this across 14 variables (spanning framing, emotions, styles, politics, and topics) using a smaller, cost-effective model (Gemini 2 Flash) by systematically isolating the effects of codebooks versus few-shot examples. Results demonstrate a clear trade-off: refinement significantly boosts human alignment for complex, low-baseline constructs but degrades performance on simple, high-baseline tasks. Notably, a smaller model using refinement matches the accuracy of state-of-the-art reasoning models (Gemini 3 Flash) on complex tasks at a lower cost. These findings establish boundary conditions for self-correction, showing that external structure and task complexity jointly determine when refinement improves data quality."
        figure: figures/self-correction.png
        figure_caption: "F1-macro before (S0, gray) and after (S3, green) refinement for each condition and construct type; bars show mean F1 across variables within each construct type."
        title: "When Does Self-Correction Work for LLMs in Content Analysis? The Role of External Structure and Task Complexity"
        authors: ["Pipal, Christian", "Wack, Morgan", "Profos, Astrid", "Vogel, Eva-Maria", "Wittstock, Nicolas", "Mpadanes, Markos"]
        year: 2026
        venue: Computational Communication Research
        details: "8(2), 1–35"
        doi: 10.5117/ccr2026.2.13.pipa

      - id: grounding
        abstract: "Following the progressing internationalisation of social science research and the computational turn in the field, researchers are increasingly adopting computational text analysis (CTA) methods to compare textual data across multiple cases and languages. In these settings, it is not only the mapping between construct and measures that requires validation, but also the equivalence of this mapping across languages and cases. However, although the validation requirements in multilingual analyses exceed those in monolingual studies, current research shows that validation is often insufficiently and inconsistently addressed in comparative multilingual CTA. To support more robust comparative research, this article presents a framework for validating findings obtained from multilingual textual data. The framework outlines validation strategies for four key stages of a typical multilingual CTA workflow: corpus, input data, process, and output. It directly tackles the challenge of approaching equivalence across contexts and languages in these stages and moves beyond the common practice of identifying problems only at the final stage of research."
        figure: figures/grounding.png
        figure_caption: "A validation framework for multilingual comparative research designs, specifying objectives, considerations and evaluation steps for corpus, input-data, process and output validation."
        title: "Grounding the Comparative Turn in Communications: A Framework for Validating Multilingual Computational Text Analysis"
        authors: ["Lind, Fabienne", "Schoonvelde, Martijn", "Baden, Christian", "Dolinsky, Alona O.", "Pipal, Christian", "van der Velden, Mariken A. C. G."]
        year: 2025
        venue: Computational Communication Research
        details: "7(1), 1–26"
        doi: 10.5117/ccr2025.1.13.lind

      - id: jst
        figure: figures/jst.png
        figure_caption: "Yearly JST speech sentiment by party in the UK House of Commons, German Bundestag and Dutch Tweede Kamer, with government periods marked."
        title: "JST and rJST: Joint Estimation of Sentiment and Topics in Textual Data Using a Semi-Supervised Approach"
        authors: ["Pipal, Christian", "Schoonvelde, Martijn", "Schumacher, Gijs", "Boiten, Max"]
        year: 2025
        venue: Communication Methods and Measures
        details: "19(2), 112–130"
        doi: 10.1080/19312458.2024.2383453
        preprint: https://doi.org/10.31219/osf.io/mt3cs
        code: https://github.com/cpipal/sentitopics
        abstract: >-
          This paper demonstrates the performance of the Joint Sentiment Topic model (JST) and the reversed Joint
          Sentiment Topic model (rJST) in measuring sentiment in political speeches, comparing them against a set of
          popular methods for sentiment analysis: widely used off-the-shelf sentiment dictionaries; an
          embeddings-enhanced dictionary approach; Latent Semantic Scaling, a semi-supervised approach; and a
          zero-shot transformer-based approach using a large language model (GPT-4). The findings reveal JST's
          superiority over all non-transformer-based approaches in predicting human-coded sentiment in multiple
          languages and its ability to replicate known sentiment trends in legislative speech. rJST, meanwhile,
          provides valuable topic-specific sentiment estimates, responsive to political dynamics and significant
          events. Both models are, however, outperformed by transformer-based models like GPT-4. Additionally, the
          paper introduces the `sentitopics` R package, designed to facilitate the use of JST and rJST in
          computational text analysis workflows. This package is compatible with popular text analysis tools, making
          the models accessible for applied researchers in communication science.

      - id: tone-politics
        figure: figures/tone-politics.png
        figure_caption: "Specification curves of legislators' tone (polarity and arousal) across a multiverse of multilevel models in seven parliaments; red marks effects with p < .05, grey p ≥ .05, showing that macro trends, ideology and experience have no systematic relationship with tone."
        title: "Tone in Politics Is Not Systematically Related to Macro Trends, Ideology, or Experience"
        authors: ["Pipal, Christian", "Bakker, Bert N.", "Schumacher, Gijs", "van der Velden, Mariken A. C. G."]
        year: 2024
        venue: Scientific Reports
        details: "14, 3241"
        doi: 10.1038/s41598-023-49618-9
        abstract: >-
          What explains the variation in tone in politics? Different literatures argue that changes in the tone of
          politicians reflect changes in the economy, general language, well-being, or ideology. So far, these claims
          have been empirically tested only in isolation, in single country studies, or with a small subset of
          indicators. We offer an overarching view by modelling the use of tone in European national parliaments in
          7 countries across 30 years. Using a semi-supervised sentiment-topic model to measure polarity and arousal
          in legislative debates, we show in a preregistered multiverse analysis that the tone in legislative debates
          is not systematically related to previously claimed factors. We also replicate the absence of such
          systematic relationships using national leader speeches and parties' election manifestos. There is also no
          universal trend towards more negativity or emotionality in political language. Overall, our results
          highlight the importance of multi-lingual and cross-country multiverse analyses for generalizing findings
          on emotions in politics.

      - id: nato
        title: "Blaming it on NATO? Framing the Role of NATO in the Full-Scale Russian Invasion of Ukraine on Twitter"
        authors: ["Kobilke, Lara", "Kulichkina, Aytalina", "Baghumyan, Ani", "Pipal, Christian"]
        year: 2023
        venue: Frontiers in Political Science
        details: "5, 1122439"
        doi: 10.3389/fpos.2023.1122439
        abstract: >-
          Since social media has become a significant tool for conflict communication amid the full-scale Russian
          invasion of Ukraine, researchers have grown more interested in the digital content citizens are exposed to.
          We conducted a manual content analysis of tweets in English, Russian, and German that explicitly mentioned
          NATO in the context of the full-scale invasion during February to May 2022, exploring how these
          language-specific Twitter communities framed NATO's role in the conflict. English-speaking tweeters were
          more likely to hold NATO responsible for finding a solution and least likely to blame NATO for the war
          compared to German and Russian speakers. The Russian-speaking Twitter community exhibits a comparatively
          lower tendency to hold NATO accountable for the ongoing war than their German-speaking counterparts, and is
          the least likely to expect NATO to bring an end to the war. The study highlights the importance of cultural
          and linguistic sensitivity when addressing responsibility in armed conflicts.

      - id: multiverse-news
        figure: figures/multiverse-news.jpg
        figure_caption: "Results from the multiverse of OLS and negative binomial models: each dot is the estimated effect of news-article sentiment on shares, comments, emojis or likes (random subset of 200 of 1,728 specifications per outcome; colours mark the sentiment dictionary)."
        title: "If You Have Choices, Why Not Choose (and Share) All of Them? A Multiverse Approach to Understanding News Engagement on Social Media"
        authors: ["Pipal, Christian", "Song, Hyunjin", "Boomgaarden, Hajo G."]
        year: 2022
        venue: Digital Journalism
        details: "11(2), 255–275"
        doi: 10.1080/21670811.2022.2036623
        abstract: >-
          Social sciences are facing a crisis of replicability, and concerns about the confidence in quantitative
          findings have resulted in an increasing interest in open science practices across many fields. In this
          article we introduce scholars of (digital) journalism studies and communication science to multiverse
          analysis while addressing the possible reasons of heterogeneity in the findings of research on engagement
          with news on social media. Using the question of which news article characteristics predict news engagement
          on social media, this illustration of the multiverse approach shows how different measurement, data
          processing, and modelling choices lead to divergent conclusions. In particular, we show how the selection of
          widely used automated text analysis tools and preprocessing steps influence the conclusions drawn from the
          analysis. We also use this illustration to guide interested scholars through the different steps of doing a
          multiverse analysis. More broadly, we demonstrate how multiverse analysis can be an open and transparent
          research approach in a field that is increasingly faced with a wide range of analytical choices.

      - id: three-gaps
        title: "Three Gaps in Computational Text Analysis Methods for Social Sciences: A Research Agenda"
        authors: ["Baden, Christian", "Pipal, Christian", "Schoonvelde, Martijn", "van der Velden, Mariken A. C. G."]
        year: 2022
        venue: Communication Methods and Measures
        details: "16(1), 1–18"
        doi: 10.1080/19312458.2021.2015574
        abstract: >-
          We identify three gaps that limit the utility and obstruct the progress of computational text analysis
          methods (CTAM) for social science research. First, we contend that CTAM development has prioritized
          technological over validity concerns, giving limited attention to the operationalization of social
          scientific measurements. Second, we identify a mismatch between CTAMs' focus on extracting specific contents
          and document-level patterns, and social science researchers' need for measuring multiple, often complex
          contents in the text. Third, we argue that the dominance of English language tools depresses comparative
          research and inclusivity toward scholarly communities examining languages other than English. We
          substantiate our claims by drawing upon a broad review of methodological work in the computational social
          sciences, as well as an inventory of leading research publications using quantitative textual analysis.
          Subsequently, we discuss implications of these three gaps for social scientists' uneven uptake of CTAM, as
          well as the field of computational social science text research as a whole. Finally, we propose a research
          agenda intended to bridge the identified gaps and improve the validity, utility, and inclusiveness of CTAM.

