      - id: mexca
        title: "MEXCA: A Simple and Robust Pipeline for Capturing Emotion Expressions in Faces, Vocalization, and Speech"
        authors: ["Lüken, Malte", "Moodley, Kody", "Viviani, Eva", "Pipal, Christian", "Schumacher, Gijs"]
        year: 2024
        venue: Python package
        preprint: https://doi.org/10.31234/osf.io/56svb
        code: https://github.com/mexca/mexca
        abstract: >-
          MEXCA is an easy-to-use tool researchers can use to capture emotion expressions from multiple modalities in
          videos. It overcomes limitations of previous software by combining existing unimodal systems to ultimately
          extract three modalities: facial muscle movements, vocalizations, and speech content. Moreover, it can also
          track faces and speakers in the video. We describe the software's architecture and features and show how
          its output can be used to analyze emotion expressions in a Dutch election debate.

