      - id: sentiment-encyclopedia
        title: "Sentiment Analysis"
        authors: ["van der Velden, Mariken A. C. G.", "Umansky, Natalia", "Pipal, Christian"]
        year: 2025
        venue: "Encyclopedia of Political Communication (eds. A. Nai, M. Grömping & D. Wirz), Edward Elgar"
        preprint: https://doi.org/10.31219/osf.io/6q2zt
        abstract: >-
          Sentiment is a central topic for scholars of Political Communication. Despite its popularity, sentiment
          suffers from a lack of agreed-upon conceptualization and operationalization. The ambiguity and complexity is
          reflected in the applications of sentiment. Scholars have used sentiment as an analytical frame to describe
          and/or explain tonality of a (news) story, outlook or perspective in a (news) story, focus on conflict or
          consensus, focus on incapability and misconduct, as well as the tone towards actors and organizations in
          media, political, and public discourse. Sentiment has especially gained popularity in the "text-as-data"
          revolution due to the availability of data as well as computational text analysis methods. In this entry,
          we highlight the existing theoretical applications based on the core theories in political communication,
          as well as review the methodological toolkit to automatically measure sentiment.

      - id: text-as-data-polpsych
        title: "Text as Data in Political Psychology"
        authors: ["Schoonvelde, Martijn", "Pipal, Christian", "Schumacher, Gijs"]
        year: 2022
        venue: "Handbook of Language Analysis in Psychology (eds. M. Dehghani & R. L. Boyd), Guilford Press"
        preprint: https://doi.org/10.31219/osf.io/p5mdq
        abstract: >-
          This chapter provides an assessment of automated text analysis methods in political psychology structured
          around the following core questions: (i) What is the current state of affairs of text as data in political
          psychology? (ii) What can political science and political psychology learn from each other when it comes to
          analysing natural language? (iii) Where does text as data in political psychology go next?

  # Only papers with a public preprint (arXiv, SocArXiv, OSF, SSRN ...) go here.
  - key: working
    title: Working papers
    items:
      - id: who-gets-counted
        figure: figures/who-gets-counted.png
        figure_caption: "Coverage against conditional accuracy for every name classifier and hybrid pipeline on 17,998 North Carolina voters; dotted curves mark constant total accuracy. Claude Haiku is the most accurate only because it labels about half of the voters."
        title: "Who Gets Counted? Large Language Models, Informative Refusal, and Downstream Bias in Name-Based Demographic Classification"
        authors: ["Pipal, Christian", "Wack, Morgan", "Vogel, Eva-Maria"]
        year: 2026
        preprint: https://arxiv.org/abs/2611.06550
        abstract: >-
          Researchers routinely infer gender, race, and ethnicity from names, yet the standard tools used for this
          task misclassify the groups that diversity research most needs to measure. Large language models (LLMs)
          have been proposed as a remedy because they label diverse names accurately. We ask whether that accuracy
          carries over to the estimates researchers report. Across 10,000 Chinese names, 19,998 North Carolina voters
          with self-reported race, and 300 political science authors with human reference codes, we compare three
          LLMs with seven traditional tools and link the voter sample to party registration and age. Selective
          labeling explains part of the LLMs' accuracy advantage. Claude Haiku labels half of the voters, and a
          traditional tool limited to its most confident half is more accurate. Hard labels from every tool
          understate the White–Black gap in Democratic registration by 36% to 65%, while BIRDiE estimation on BISG
          posteriors comes within 0.03 of it. Haiku's missing labels select on age, inflating the age gap by six
          years. Combined with BISG, LLM answers sharpen individual labels without a demonstrated gain in BIRDiE
          accuracy. Classifiers should be judged by the estimates they produce, including the consequences of
          missing labels.

      - id: model-sees
        figure: figures/model-sees.png
        figure_caption: "Estimated minus human-coded sample prevalence for every binary construct, model and input route (496 estimates); even the highest-F1 deployable route (last column) often misses the human-coded prevalence by more than ten points."
        title: "What Does the Model See? Representation Validity in Multimodal LLM-Based Video Analysis"
        authors: ["Pipal, Christian", "Vogel, Eva-Maria", "Wack, Morgan"]
        year: 2026
        preprint: https://arxiv.org/abs/2611.05181
        abstract: >-
          Multimodal large language models (MLLMs) allow social scientists to analyze video at scale, but researchers
          must decide which parts of a video to provide as input. We use the term representation validity to examine
          how text, audio, video, and combined inputs affect measurement and subsequent analysis. We compare input
          representations across six open-weight MLLMs and three human-annotated video datasets. No representation
          consistently performs best. On seven news-related constructs, native-video performance varies little across
          models (macro-F1 = .70-.77), while extracted-text performance ranges from .52 to .80. Three models perform
          better with text and three with video. Combining inputs rarely improves performance. Higher classification
          accuracy also does not reliably produce estimates closer to those based on human codes. The highest-F1
          representation best reproduces human-coded regression coefficients in 17 of 42 comparisons. Even when each
          model uses its highest-F1 deployable representation, 45% of sample-prevalence estimates differ from the
          human-coded benchmark by more than ten percentage points. Input representation therefore requires
          validation for both the construct being measured and the quantity estimated from the resulting labels.

      - id: batching
        figure: figures/batching.png
        figure_caption: "Cost savings versus accuracy change relative to b=1 for each model and batch size; the shaded region marks the safe operating zone, and batch-size labels show where larger batches push models along the cost–accuracy frontier."
        title: "Researchers Waste 80% of LLM Annotation Costs by Classifying One Text at a Time"
        authors: ["Pipal, Christian", "Vogel, Eva-Maria", "Wack, Morgan", "Esser, Frank"]
        year: 2026
        preprint: https://doi.org/10.31235/osf.io/bxtsf_v1
        abstract: >-
          Large language models (LLMs) are increasingly being used for text classification across the social
          sciences, yet researchers overwhelmingly classify one text per variable per prompt. Coding 100,000 texts on
          four variables requires 400,000 API calls. Batching 25 items and stacking all variables into a single prompt
          reduces this to 4,000 calls, cutting token costs by over 80%. Whether this degrades coding quality is
          unknown. We tested eight production LLMs from four providers on 3,962 expert-coded tweets across four tasks,
          varying batch size from 1 to 1,000 items and stacking up to 25 coding dimensions per prompt. Six of eight
          models maintained accuracy within 2 pp of the single-item baseline through batch sizes of 100. Variable
          stacking with up to 10 dimensions produced results comparable to single-variable coding, with degradation
          driven by task complexity rather than prompt length. Within this safe operating range, the measurement
          error from batching and stacking is smaller than typical inter-coder disagreement in the ground-truth data.

      - id: learning-political
        figure: figures/learning-political.png
        figure_caption: "Audience engagement and the dynamics of political posting (H4): better relative performance of a creator's first political post predicts a sooner next political post (a), and stronger engagement with lifestyle-political posts predicts a sooner first formal-political post (b); hazard ratios plus Kaplan–Meier curves by performance quartile."
        title: "Learning to Be Political: Audience Reinforcement and the Disproportionate Political Role of Smaller Social Media Influencers"
        authors: ["Pipal, Christian", "Wack, Morgan", "Vogel, Eva-Maria", "Esser, Frank"]
        year: 2026
        award: ICA Top Paper Award 2026
        preprint: https://doi.org/10.31235/osf.io/rykgf_v1
        abstract: >-
          Some social media influencers (SMIs) occasionally discuss political actors and events, while others
          regularly engage with political topics. We ask here whether audience response helps explain this
          difference. We argue that engagement with political posts provides feedback that can reinforce further
          political posting and, over time, a move toward formal-political content. We test this argument using
          761,102 Instagram posts from 1,683 Austrian and German SMIs collected over 60 months (2021–2025), combining
          a validated two-stage text classification pipeline with within-creator fixed-effects regressions and Cox
          proportional-hazards models. Political posts receive 18% more likes and 28% more comments than non-political
          posts by the same creator, although this boost is not larger for smaller creators. A better-performing first
          political post is followed sooner by another political post. Stronger engagement with lifestyle-political
          posts also predicts an earlier move into formal-political content, with implications for democracy given
          the increasing prominence of SMIs as agenda-setters in digital ecosystems. Smaller creators post political
          content at higher rates. Audience response therefore helps explain why political communication by SMIs
          persists and how it can move toward formal politics.

      - id: biased-provision
        figure: figures/biased-provision.png
        figure_caption: "Opposing-side presence by query framing for each system: language models (blue) fan out under confirmatory framing while search engines (red) stay clustered, so between-LLM differences grow as queries become more leading."
        title: "Biased Provision: Cross-Provider Divergence in How LLMs and Search Engines Supply Evidence on Contested Political Questions"
        authors: ["Wack, Morgan", "Vogel, Eva-Maria", "Pipal, Christian"]
        year: 2026
        preprint: https://doi.org/10.31235/osf.io/5g2tw_v1
        abstract: >-
          Does the evidence generated to answer political questions depend on which large language model (LLM) users
          query? We introduce "biased provision" to describe this dependence, which can arise where providers differ in
          how compliant their models are to user requests. Auditing four LLMs, four search engines, and two hybrids
          across 8,249 responses to 30 claims, we find similar average rates of disconfirming evidence, evidence
          against the claim asked about, across system types but larger differences among LLMs. All four LLMs answered
          neutral questions with similar evidence but diverged once users asked for support, whereas search engines
          narrowed together only after queries included the user's argument. Search engines supplied the least
          disconfirming evidence under argued requests, a baseline for claims of chatbot sycophancy. As political
          questions migrate from search engines to chatbots, the evidence users receive will depend less on the tools
          people use than on which chatbot's answers they prefer.

      - id: nice-try-chatgpt
        figure: figures/nice-try-chatgpt.png
        figure_caption: "What the conversation is about after each kind of reply: follow-on comments dispute authenticity 45% of the time after an AI accusation and 24% after a bot accusation, versus 3% after ordinary dismissals and 2% after a substantive reply, while substantive engagement drops to 29%."
        title: "Nice Try, ChatGPT: AI Accusations Target Opponents and Divert Political Debates"
        authors: ["Wack, Morgan", "Pipal, Christian", "Vogel, Eva-Maria"]
        year: 2026
        preprint: https://doi.org/10.31235/osf.io/36mys_v1
        abstract: >-
          It is becoming increasingly common to encounter AI-generated text online. Yet at the same time it is often
          difficult to distinguish authentic text from generative outputs, particularly within shorter posts. Given
          this conflict, we expect accusations that a text was AI-generated to become a common strategy for deflecting
          unwelcome arguments. To study the occurrence of these accusations and their impact on online discourse, we
          draw on posts collected across two years and twelve political Reddit communities to track who is accused,
          whether accused comments are flagged by detection tools as AI more often, and whether these accusations
          disproportionately disrupt debates. Consistent with research on motivated reasoning, accusers from across
          the political spectrum targeted comments which opposed their views at higher rates, 72% of the time against
          50% for comparable same-thread comments. AI accusations also disproportionately undermined open debate.
          Compared to other types of hostile dismissals, we find that substantive engagement falls to 29% (from 67%),
          with threads often turning to the litigation of a post's authenticity rather than engaging with its
          substance. These findings illustrate the growing tendency to indict political opponents as inauthentic,
          which we call the motivated attribution of inauthenticity, while illustrating how the existence of
          generative AI can harm political conversations through suspicion alone.

      - id: world-cup
        title: "Who Sees Politics in Sports? Norm Endorsement and Partisan Judgments from the 2026 World Cup"
        authors: ["Wack, Morgan", "Vogler, Daniel", "Arrigo, Manuel", "Pipal, Christian", "da Silva, Lucas Paulo"]
        year: 2026
        preprint: https://doi.org/10.31235/osf.io/gtjp4_v1
        abstract: >-
          Most Americans say politics should stay out of sports. Yet whether this norm is truly binding depends on
          whether people apply it when their own side violates the norm. To test this "apolitical sports" norm, we
          fielded a two-wave matched panel survey around the 2026 FIFA World Cup (N1 = 988; N2 = 699). During the
          tournament, U.S. President Donald Trump called FIFA to have an American player's red-card suspension lifted.
          We asked respondents to judge the incident directly and to judge a message on players' shirts, varied to
          support or protest a contentious U.S. policy. Overall, endorsing the norm predicted lower tolerance for
          political expression in sports, within each party separately, with a smaller own-side advantage. Following
          this widely reported violation, Democrats raised their endorsement while Republicans did not. What divided
          partisans most was what they counted as a violation, with Republicans reporting less political
          interference. In short, while both sides agreed with the norm, they disagreed about whether it had been
          broken. Our findings suggest that partisan accommodation can influence how citizens recall and conceive of
          potentially norm-violating events.

      - id: ai-parliaments
        figure: figures/ai-parliaments.png
        figure_caption: "Two-shock interrupted time series: (A) model-predicted monthly AI attention in eight parliaments against a no-shock counterfactual around ChatGPT and the AI Act, and (B) per-country ChatGPT slope-change incidence rate ratios."
        title: "After ChatGPT, After the AI Act: Artificial Intelligence in Eight European Parliaments, 2015–2026"
        authors: ["Pipal, Christian"]
        year: 2026
        preprint: https://doi.org/10.2139/ssrn.6866874
        abstract: >-
          Artificial intelligence (AI) has become a central policy concern in Europe, but little is known about how
          national parliaments debated the technology. The closest study covers four legislatures, three outside
          Europe. I address the within-Europe question through two natural shocks, the release of ChatGPT in November
          2022 and the entry into force of the EU AI Act in August 2024. The corpus contains 3,594,388 parliamentary
          speeches from eight European countries between 2015 and 2026, of which 9,948 are AI-related and coded on
          thirteen dimensions using a large language model with human-validated reliability. The post-ChatGPT
          acceleration is concentrated in the United Kingdom and Norway rather than common across the eight.
          References to the AI Act follow an integration gradient, with European Union members five times higher than
          the post-Brexit United Kingdom and EEA Norway close to the member rate. Government and opposition frame AI
          in opposing terms along a left–right gradient. The European AI debate is a structured field organised by
          Union relationship and the government–opposition cleavage, which matters for regulatory diffusion after
          Brexit.

      - id: fact-checks-llms
        figure: figures/fact-checks-llms.png
        figure_caption: "Vulnerability by fact-check presence: fact-checked narratives cut uncertain responses from 20.0% to 6.4% and contamination from 4.2% to 0.6%, and average 7.0% non-rejection per narrative versus 24.6% for non-fact-checked narratives."
        title: "Fact-Checks Can Help Inoculate LLMs Against Disinformation"
        authors: ["Wack, Morgan", "Vogel, Eva-Maria", "Pipal, Christian", "Warren, Patrick"]
        year: 2026
        preprint: https://doi.org/10.31235/osf.io/nrs5z_v1
        abstract: >-
          Large language models (LLMs) have become the first source millions consult when evaluating political claims,
          yet they were trained on an open internet that state-sponsored disinformation operations have been designed
          to pollute. We audit four frontier models across 2,268 responses to 63 fabrications from eight documented
          influence operations and find that even a single published fact-check can shift a model from hedging about a
          fabrication to rejecting it outright. Overall, models correctly rejected only 81% of fabrications while
          repeating disinformation in 3% of cases. Critically, the remaining 16% of responses would have left users
          unable to determine whether fabricated claims were true or false. Narratives which had been debunked by at
          least one IFCN-certified fact-checking organization were correctly rejected as disinformation 93% of the
          time compared to just 76% of the time for unchecked narratives. Exploratory analyses suggest that this
          mechanism operates through training data, with models echoing the specific vocabulary of published
          corrections when available during their training windows. Fact-checks designed for human audiences appear to
          serve as effective protection for LLMs, converting both model uncertainty and outright disinformation into
          definitive rejections.

      - id: dances-duets
        figure: figures/dances-duets.png
        figure_caption: "Joint negative-binomial associations of all six communicative styles, five political functions, electoral content and footage provenance with plays, likes, comments and shares for 16,327 videos from 74 U.S. politicians (count ratios with 90%/95% intervals)."
        title: "Dances, Duets, and Debates: Analysing Political Communication and Viewer Engagement on TikTok"
        authors: ["Pipal, Christian", "Umansky, Natalia"]
        year: 2023
        award: ICA Top Paper Award 2024
        preprint: https://doi.org/10.31219/osf.io/g8dbu
        abstract: >-
          Launched in 2017, TikTok has rapidly gained global popularity, extending beyond entertainment to become a
          hub for ideological formation and political activism, revolutionizing the way politicians interact with
          constituents. Yet, despite extensive research on politicians' use of social media platforms like Twitter
          and Facebook, TikTok's distinct platform-specific languages and features have received limited attention.
          This paper provides a first examination of the ways in which U.S. politicians embrace and adapt to the
          TikTok platform. Employing a multimodal approach that studies video, text, and audio, we collect and analyse
          a novel dataset of TikTok videos created by U.S. Governors and Members of Congress to understand how they
          use comedic, documentary, communal, explanatory, interactive, and meta communication styles to connect with
          their audience. U.S. politicians primarily use TikTok to communicate about political issues, often adopting
          explanatory and documentary styles to articulate their policies. However, the comedic style significantly
          boosts engagement, especially for female politicians, who see a fourfold increase in engagement when
          producing comedic content compared to male counterparts. This presents a challenge for politicians:
          balancing humor's allure with the seriousness expected from them.

